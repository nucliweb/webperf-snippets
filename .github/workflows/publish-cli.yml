name: Publish CLI

on:
  push:
    tags:
      - 'cli-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # The wait for the approval of the environment does not count
    timeout-minutes: 30
    environment: npm-publish
    # id-token: the OIDC token of the run, which npm (trusted publishing) and the MCP Registry
    # accept instead of a stored secret
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check the version of the tag
        run: node scripts/check-tag-version.js "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit --prefix cli

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: cli

      - name: Run E2E tests
        run: npm run test:e2e --prefix cli

      - name: Prepare snippets for publishing
        run: cp -r snippets cli/

      # Trusted publishing: npm exchanges the OIDC token of this workflow for a short-lived one, and adds
      # the provenance of the package. A rerun after a later step failed finds the version on npm already,
      # which npm refuses to publish again: it goes on to the MCP Registry instead.
      - name: Publish to npm
        working-directory: cli
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "webperf-snippets@$version" version > /dev/null 2>&1; then
            echo "webperf-snippets@$version is on npm already"
          else
            npm publish
          fi

      # A download from GitHub releases can answer 504: --fail stops an error page from reaching tar,
      # and the retries cover a failure that lasts a few seconds. The checksum is the one of
      # registry_1.8.1_checksums.txt in that release: this binary runs with the OIDC token of the job
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sSL --fail --retry 5 --retry-all-errors --retry-delay 10 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # The registry checks that the npm package of cli/server.json carries its name in mcpName, so it
      # waits for npm to list the version it has just published: 1.1.0 took about two and a half minutes
      - name: Publish to the MCP Registry
        working-directory: cli
        run: |
          ../mcp-publisher login github-oidc
          for attempt in $(seq 10); do
            ../mcp-publisher publish && exit 0
            echo "Attempt $attempt failed, npm may not list the version yet"
            sleep 30
          done
          exit 1
