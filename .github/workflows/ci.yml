name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check consistency
        run: npm run check:consistency

      - name: Run demo tests
        run: npm run test:demos

      - name: Check emojis have icons
        run: npm run check:emoji

      - name: Run icon plugin tests
        run: npm run test:icons

      - name: Check generated skills are up to date
        run: npm run generate-skills:check

      - name: Run unit tests
        run: npm run test:unit --prefix cli

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: cli

      - name: Run E2E tests
        run: npm run test:e2e --prefix cli
