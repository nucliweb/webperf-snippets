name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to a pull request cancels the run in progress for its previous
# commit. A push to main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The jobs run side by side, each on its own runner. The E2E tests of the CLI are most of the time
# of a run, so they are split in shards: a shard has a whole runner, as the suite had when it ran
# alone, and the tests that read timings keep their margin.
jobs:
  # A pull request that only changes documentation skips the jobs that build and launch Chromium, and
  # one that only changes the site skips the e2e tests (scripts/ci-skip-slow-steps.js)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_build: ${{ steps.slow.outputs.skip_build }}
      skip_e2e: ${{ steps.slow.outputs.skip_e2e }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Decide whether to skip the slow jobs
        id: slow
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-skip-slow-steps.js

  # What needs neither a build nor a browser
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the repository
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Check consistency
        run: npm run check:consistency

      - name: Check the versions agree
        run: npm run check:versions

      # A release that is merged and not tagged is not published, and the site names its version
      # already. It warns and does not fail: the tag comes right after the merge
      - name: Warn about versions without a tag
        if: github.event_name == 'push'
        run: node scripts/release-versions.js --untagged

      - name: Check emojis have icons
        run: npm run check:emoji

      - name: Check generated skills are up to date
        run: npm run generate-skills:check

      - name: Check generated llms files are up to date
        run: npm run generate-llms:check

      - name: Run demo tests
        run: npm run test:demos

      - name: Run icon plugin tests
        run: npm run test:icons

      - name: Run browser support tests
        run: npm run test:support

      - name: Run snippet prompt tests
        run: npm run test:prompt

      - name: Run result view tests
        run: npm run test:view

      - name: Run extension tests
        run: npm run test:extension

      - name: Run skill script tests
        run: npm run test:skills

      - name: Run CI helper tests
        run: npm run test:ci

      - name: Run component tests
        run: npm run test:components

      - name: Run site tests
        run: npm run test:site

      - name: Run unit tests
        run: npm run test:unit --prefix cli

  build:
    needs: changes
    if: needs.changes.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Build
        run: npm run build

      - name: Check the built snippets
        run: npm run check:built-snippets

      # Reports to the job summary and does not block: a failing audit marks this step, not the job.
      - name: Audit agentic browsing with Lighthouse
        continue-on-error: true
        run: npm run audit:agentic

  e2e-cli:
    name: E2E of the CLI (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.skip_e2e != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A shard that fails does not stop the others: the run says everything that fails
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Run E2E tests
        run: npm run test:e2e --prefix cli -- --shard=${{ matrix.shard }}/4

  e2e-extension:
    name: E2E of the extension
    needs: changes
    if: needs.changes.outputs.skip_e2e != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the repository
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Run extension E2E tests
        run: npm run test:extension:e2e
