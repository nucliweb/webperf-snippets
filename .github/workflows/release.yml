name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check the version of the tag
        run: node scripts/check-tag-version.js "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Generate skills
        run: node scripts/generate-skills.js

      - name: Package skills
        run: |
          cd skills
          for dir in */; do
            skill_name="${dir%/}"
            zip -r "../${skill_name}.zip" "$dir"
          done
          cd ..
          zip -r "webperf-skills-all.zip" skills/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          # Every zip the step above wrote: one per skill, and all of them together
          files: '*.zip'
          fail_on_unmatched_files: true

      # Uncomment when ready to notify downstream repos instantly
