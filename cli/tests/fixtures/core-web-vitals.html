<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Core Web Vitals example fixture</title>
  <style>
    body { margin: 0; font-family: sans-serif; padding: 24px; }
    main { max-width: 760px; margin: 0 auto; }
    video { display: block; width: min(480px, 100%); height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
    img { display: block; width: 320px; max-width: 100%; height: auto; }
    button { margin-top: 1rem; padding: 0.75rem 1rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="main-heading">A seeded page for Core Web Vitals examples</h1>
    <video id="hero-video" autoplay muted playsinline loop preload="auto" poster="/hero.png">
      <source src="/clip.webm" type="video/webm">
    </video>
    <p>The fixture reserves media dimensions so loading does not shift the page.</p>
    <img id="secondary-image" src="/hero.png" width="320" height="240" alt="A sample landscape image">
    <button id="interaction-button" type="button">Run a sample interaction</button>
    <p id="interaction-result" aria-live="polite">Waiting for interaction.</p>
  </main>
  <script>
    document.querySelector("#interaction-button").addEventListener("click", () => {
      document.querySelector("#interaction-result").textContent = "Interaction recorded.";
    });
  </script>
</body>
</html>
