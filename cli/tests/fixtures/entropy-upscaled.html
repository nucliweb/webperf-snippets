<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upscaled small image</title>
</head>
<body style="margin:0">
  <!-- 40 × 40 pixels of noise stretched to 900 × 600: few bits per displayed pixel, many per natural pixel -->
  <img id="upscaled" src="/noise.png" style="display:block;width:900px;height:600px" alt="">
  <p style="font-size:8px;margin:0">Small text</p>
</body>
</html>
