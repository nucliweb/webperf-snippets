<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Video poster from an image CDN fixture</title>
</head>
<body style="margin:0">
  <!-- A video that does not play: its poster is the LCP, and an image CDN serves it as AVIF, as its fm parameter asks -->
  <video id="hero" width="640" height="360" poster="/hero.png?fm=avif" preload="none">
    <source src="/clip.webm" type="video/webm">
  </video>
  <p style="font-size:8px;margin:0">Caption</p>
</body>
</html>
