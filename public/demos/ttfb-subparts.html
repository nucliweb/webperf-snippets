<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How the TTFB sub-parts add up</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --tab-active-bg: #1c2a3f;
  --accent: #58a6ff;
  --zone-good: rgba(63,185,80,.13);
  --zone-mid: rgba(227,179,65,.13);
  --zone-poor: rgba(248,81,73,.13);
  --c-good: #3fb950;
  --c-mid: #e3b341;
  --c-poor: #f85149;
  --p-redirect: #e3b341;
  --p-sw: #d2a8ff;
  --p-dns: #58a6ff;
  --p-tcp: #39c5cf;
  --p-tls: #f0883e;
  --p-request: #f778ba;
}

[data-theme="light"] {
  --bg: #ffffff;
  --surface: #f6f8fa;
  --surface2: #eaeef2;
  --border: #d0d7de;
  --text: #1f2328;
  --muted: #656d76;
  --tab-active-bg: #dbeafe;
  --accent: #0969da;
  --zone-good: rgba(26,127,55,.10);
  --zone-mid: rgba(154,103,0,.10);
  --zone-poor: rgba(207,34,46,.10);
  --c-good: #1a7f37;
  --c-mid: #9a6700;
  --c-poor: #cf222e;
  --p-redirect: #bf8700;
  --p-sw: #8250df;
  --p-dns: #0969da;
  --p-tcp: #1b7c83;
  --p-tls: #bc4c00;
  --p-request: #bf3989;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

button { font: inherit; color: inherit; }

/* Scenario tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.2;
  transition: border-color .15s, color .15s, background .15s;
}
.tab:hover { color: var(--text); border-color: var(--accent); }
.tab[aria-pressed="true"] { color: var(--text); background: var(--tab-active-bg); border-color: var(--accent); }

/* Result header */
.result {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.ttfb { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 96px; }
.ttfb small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid currentColor;
}
.badge.good { color: var(--c-good); }
.badge.mid { color: var(--c-mid); }
.badge.poor { color: var(--c-poor); }
.story { color: var(--muted); font-size: 12px; flex: 1 1 260px; }
.play {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: var(--tab-active-bg);
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
}
.play:hover { filter: brightness(1.1); }

/* Timeline */
.timeline-wrap { padding: 4px 2px 0; }
.timeline {
  position: relative;
  height: 46px;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  background:
    linear-gradient(to right,
      var(--zone-good) 0, var(--zone-good) 40%,
      var(--zone-mid) 40%, var(--zone-mid) 90%,
      var(--zone-poor) 90%, var(--zone-poor) 100%);
}
.seg {
  position: absolute;
  top: 6px;
  bottom: 6px;
  min-width: 0;
  border-radius: 3px;
  opacity: 0;
  transform-origin: left center;
  transition: opacity .2s ease;
  cursor: pointer;
  border: 0;
  outline-offset: 1px;
}
.seg.shown { opacity: 1; }
.seg.dim { opacity: .28; }
.cursor {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--text);
  left: 0;
  pointer-events: none;
}
.axis { position: relative; height: 26px; margin-top: 4px; font-size: 10px; color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; }
.axis .t800, .axis .t1800 { top: 0; }
.axis .lbl { top: 12px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }

/* Phase table */
.phases { display: flex; flex-direction: column; gap: 6px; }
.phase {
  display: grid;
  grid-template-columns: 12px 108px 64px 1fr;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  width: 100%;
  transition: border-color .15s, background .15s;
}
.phase:hover { border-color: var(--accent); }
.phase[aria-pressed="true"] { border-color: var(--accent); background: var(--tab-active-bg); }
.phase.zero { opacity: .55; }
.dot { width: 12px; height: 12px; border-radius: 3px; }
.p-name { font-weight: 600; }
.p-ms { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.p-cause { color: var(--muted); font-size: 12px; }
.phase[aria-pressed="true"] .p-cause { color: var(--text); }

.note { color: var(--muted); font-size: 12px; padding: 0 2px; }

@media (max-width: 560px) {
  .phase { grid-template-columns: 12px 96px 56px; }
  .p-cause { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  .seg { transition: none; }
}
</style>
</head>
<body>

<div class="tabs" id="tabs" role="group" aria-label="Scenario"></div>

<div class="result" aria-live="polite">
  <div class="ttfb" id="ttfb">0<small>ms</small></div>
  <span class="badge good" id="badge">Good</span>
  <p class="story" id="story"></p>
  <button class="play" id="play" type="button">Replay</button>
</div>

<div class="timeline-wrap">
  <div class="timeline" id="timeline" aria-hidden="true"><div class="cursor" id="cursor"></div></div>
  <div class="axis" id="axis" aria-hidden="true"></div>
</div>

<div class="phases" id="phases" role="group" aria-label="TTFB sub-parts"></div>
<p class="note">Select a sub-part to highlight it on the timeline. The scale is the same in every scenario (0 to 2000 ms), so the bars are comparable.</p>

<script>
const MAX_MS = 2000;
const GOOD_MS = 800;
const POOR_MS = 1800;

const PHASES = [
  { key: "redirect", name: "Redirect",       color: "--p-redirect", cause: "Redirect chains, http to https hops, www to non-www hops." },
  { key: "sw",       name: "Service worker", color: "--p-sw",       cause: "Worker startup and cache lookups before the request goes out." },
  { key: "dns",      name: "DNS",            color: "--p-dns",      cause: "Cold DNS cache, slow resolver, many distinct hostnames." },
  { key: "tcp",      name: "TCP",            color: "--p-tcp",      cause: "Distance to the server, no connection reuse." },
  { key: "tls",      name: "SSL/TLS",        color: "--p-tls",      cause: "No session resumption, extra round trips in the handshake." },
  { key: "request",  name: "Request",        color: "--p-request",  cause: "Slow backend, database queries, no cache in front of the origin." },
];

const SCENARIOS = [
  {
    id: "cold", label: "Cold visit",
    values: { redirect: 0, sw: 0, dns: 45, tcp: 60, tls: 75, request: 320 },
    story: "First visit to a site. The browser resolves the name, opens a connection and negotiates TLS before the server can answer.",
  },
  {
    id: "warm", label: "Warm connection",
    values: { redirect: 0, sw: 0, dns: 0, tcp: 0, tls: 0, request: 320 },
    story: "The connection is already open, for example after a preconnect or an earlier request to the same origin. Only the request itself is left.",
  },
  {
    id: "redirect", label: "Redirect chain",
    values: { redirect: 420, sw: 0, dns: 45, tcp: 60, tls: 75, request: 280 },
    story: "Two hops before the final URL. The redirect time counts against TTFB, and the last hop opens a new connection.",
  },
  {
    id: "sw", label: "Service worker cold start",
    values: { redirect: 0, sw: 210, dns: 45, tcp: 60, tls: 75, request: 320 },
    story: "The worker has to start before it can answer the navigation, and it then falls back to the network.",
  },
  {
    id: "slow", label: "Slow server",
    values: { redirect: 0, sw: 0, dns: 45, tcp: 60, tls: 75, request: 1650 },
    story: "The network part is unchanged, but the server takes over a second and a half to produce the HTML. The request sub-part dominates.",
  },
];

const $ = (id) => document.getElementById(id);
const tabsEl = $("tabs"), phasesEl = $("phases"), timelineEl = $("timeline");
const cursorEl = $("cursor"), ttfbEl = $("ttfb"), badgeEl = $("badge"), storyEl = $("story");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

let current = SCENARIOS[0];
let selected = null;
let raf = 0;

const total = (s) => PHASES.reduce((n, p) => n + s.values[p.key], 0);
const pct = (ms) => (ms / MAX_MS) * 100;

function rating(ms) {
  if (ms <= GOOD_MS) return { cls: "good", text: "Good" };
  if (ms <= POOR_MS) return { cls: "mid", text: "Needs improvement" };
  return { cls: "poor", text: "Poor" };
}

/* One-time DOM */
SCENARIOS.forEach((s) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tab";
  b.textContent = s.label;
  b.dataset.id = s.id;
  b.addEventListener("click", () => selectScenario(s));
  tabsEl.appendChild(b);
});

PHASES.forEach((p) => {
  const seg = document.createElement("div");
  seg.className = "seg";
  seg.dataset.key = p.key;
  seg.style.background = `var(${p.color})`;
  timelineEl.insertBefore(seg, cursorEl);

  const row = document.createElement("button");
  row.type = "button";
  row.className = "phase";
  row.dataset.key = p.key;
  row.innerHTML =
    `<span class="dot" style="background:var(${p.color})"></span>` +
    `<span class="p-name">${p.name}</span>` +
    `<span class="p-ms" data-ms></span>` +
    `<span class="p-cause">${p.cause}</span>`;
  row.addEventListener("click", () => {
    selected = selected === p.key ? null : p.key;
    paintSelection();
  });
  phasesEl.appendChild(row);
});

const axisEl = $("axis");
axisEl.innerHTML =
  `<span style="left:0">0</span>` +
  `<span class="t800" style="left:${pct(GOOD_MS)}%">800 ms</span>` +
  `<span class="t1800" style="left:${pct(POOR_MS)}%">1800 ms</span>` +
  `<span class="lbl" style="left:${pct(GOOD_MS) / 2}%;color:var(--c-good)">good</span>` +
  `<span class="lbl" style="left:${(pct(GOOD_MS) + pct(POOR_MS)) / 2}%;color:var(--c-mid)">needs improvement</span>` +
  `<span class="lbl" style="left:${(pct(POOR_MS) + 100) / 2}%;color:var(--c-poor)">poor</span>`;

/* Rendering */
function layout() {
  let start = 0;
  PHASES.forEach((p) => {
    const ms = current.values[p.key];
    const seg = timelineEl.querySelector(`.seg[data-key="${p.key}"]`);
    seg.style.left = pct(start) + "%";
    seg.style.width = pct(ms) + "%";
    seg.style.display = ms > 0 ? "" : "none";
    seg.title = `${p.name}: ${ms} ms`;
    seg.dataset.start = start;
    seg.dataset.end = start + ms;
    start += ms;
    const row = phasesEl.querySelector(`.phase[data-key="${p.key}"]`);
    row.querySelector("[data-ms]").textContent = ms + " ms";
    row.classList.toggle("zero", ms === 0);
  });
}

function paintSelection() {
  phasesEl.querySelectorAll(".phase").forEach((row) =>
    row.setAttribute("aria-pressed", String(row.dataset.key === selected)));
  timelineEl.querySelectorAll(".seg").forEach((seg) =>
    seg.classList.toggle("dim", selected !== null && seg.dataset.key !== selected));
}

function setProgress(ms) {
  cursorEl.style.left = pct(ms) + "%";
  timelineEl.querySelectorAll(".seg").forEach((seg) => {
    const s = Number(seg.dataset.start), e = Number(seg.dataset.end);
    const visible = ms >= e ? 1 : ms > s ? (ms - s) / (e - s) : 0;
    seg.classList.toggle("shown", visible > 0);
    // reveal the segment progressively from its left edge
    seg.style.clipPath = `inset(0 ${(1 - visible) * 100}% 0 0)`;
  });
  const r = rating(ms);
  ttfbEl.firstChild.nodeValue = Math.round(ms);
  badgeEl.className = "badge " + r.cls;
  badgeEl.textContent = r.text;
}

function play() {
  cancelAnimationFrame(raf);
  const end = total(current);
  if (reduceMotion.matches) return setProgress(end);
  const duration = 900 + (end / MAX_MS) * 1500;
  const t0 = performance.now();
  (function tick(now) {
    const k = Math.min(1, (now - t0) / duration);
    setProgress(end * k);
    if (k < 1) raf = requestAnimationFrame(tick);
  })(t0);
}

function selectScenario(s) {
  current = s;
  selected = null;
  tabsEl.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === s.id)));
  storyEl.textContent = s.story;
  layout();
  paintSelection();
  play();
}

$("play").addEventListener("click", play);
selectScenario(SCENARIOS[0]);

/* Theme */
function applyTheme(t) { document.documentElement.setAttribute("data-theme", t || "dark"); }
(function initTheme() {
  const stored = localStorage.getItem("theme");
  if (stored) return applyTheme(stored);
  applyTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
})();
addEventListener("storage", (e) => { if (e.key === "theme") applyTheme(e.newValue); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
  if (!localStorage.getItem("theme")) applyTheme(e.matches ? "dark" : "light");
});

/* Height */
function notifyHeight() { window.parent.postMessage({ demoHeight: document.body.offsetHeight }, "*"); }
new ResizeObserver(notifyHeight).observe(document.body);
</script>
</body>
</html>
